# XcodeGen spec for the QRX iOS app. Regenerate the project with:
#   xcodegen generate --spec ios/project.yml
name: QRX
options:
  bundleIdPrefix: net.bcl
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
packages:
  JsonUI:
    url: https://github.com/bclnet/JsonUI
    branch: master
  JsonScene:
    url: https://github.com/bclnet/JsonScene
    branch: master
  JsonMind:
    url: https://github.com/bclnet/JsonMind
    branch: master
  TokenX:
    url: https://github.com/bclnet/TokenX
    branch: master
  QRXCore:
    path: ..
targets:
  QRX:
    type: application
    platform: iOS
    sources:
      - path: QRX
      - path: ../examples
        type: folder
        buildPhase: resources
    dependencies:
      - package: QRXCore
        product: QRXCore
      - package: JsonUI
        product: JsonUI
      - package: JsonScene
        product: JsonScene
      - package: JsonMind
        product: JsonMindTokenX
      - package: TokenX
        product: TokenX
      - package: TokenX
        product: TokenXApple
      - package: TokenX
        product: TokenXUI
      - sdk: ARKit.framework
      - sdk: CoreBluetooth.framework
      - sdk: Vision.framework
      - sdk: WebKit.framework
      - sdk: AVKit.framework
      - sdk: Speech.framework
    info:
      path: QRX/Info.plist   # generated by XcodeGen from these properties; do not edit the plist by hand
      properties:
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        NSCameraUsageDescription: QRX looks through the camera to find QR glyphs and place their content in the room.
        NSBluetoothAlwaysUsageDescription: QRX shares glyphs with nearby QRX devices and drives Particle LED boards over Bluetooth.
        NSMicrophoneUsageDescription: QRX listens while you hold the talk button so characters in a scene can hear you.
        NSSpeechRecognitionUsageDescription: QRX turns what you say into text for the characters in a scene.
        NSLocalNetworkUsageDescription: QRX can send prompts to an AI server on your local network when you choose one in Settings.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.bcl.qrx
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_ASSET_PATHS: ""
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
  QRXTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QRXTests
    dependencies:
      - target: QRX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.bcl.qrx.tests
schemes:
  QRX:
    build:
      targets:
        QRX: all
        QRXTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QRXTests
